<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2341">
  <meta name="description" content="مكتبة فيديوهات أكاديمية المستقبل العربية">
  <title>أكاديمية المستقبل العربية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#video-grid">انتقل إلى الفيديوهات</a>

  <header class="site-header">
    <a class="channel" id="channel-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="زيارة قناة أكاديمية المستقبل العربية على يوتيوب">
      <img id="channel-logo" class="channel__logo" src="assets/icons/brain.png" alt="شعار أكاديمية المستقبل العربية">
      <span class="channel__identity">
        <strong>أكاديمية المستقبل العربية</strong>
        <small id="channel-handle">@arabicfutureacademy</small>
      </span>
    </a>

    <form class="search" id="search-form" role="search">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
      <label class="sr-only" for="search-input">ابحث في عناوين الفيديوهات ووصفها</label>
      <input id="search-input" type="search" autocomplete="off" placeholder="ابحث في عناوين الفيديوهات ووصفها…">
      <button class="search__clear" id="search-clear" type="button" aria-label="مسح البحث" hidden>×</button>
    </form>

    <button class="playlist-toggle" id="playlist-toggle" type="button" aria-controls="playlist-panel" aria-expanded="false">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      قوائم التشغيل
    </button>
  </header>

  <div class="page-shell">
    <main class="main-content">
      <div class="content-heading">
        <div>
          <p class="eyebrow" id="view-eyebrow">مكتبة الأكاديمية</p>
          <h1 id="view-title">جميع الفيديوهات</h1>
        </div>
        <div class="heading-actions">
          <label class="sort-control" id="sort-control" for="video-sort">
            ترتيب الفيديوهات
            <select id="video-sort">
              <option value="newest">الأحدث أولاً</option>
              <option value="oldest">الأقدم أولاً</option>
            </select>
          </label>
          <p class="result-count" id="result-count" aria-live="polite"></p>
        </div>
      </div>

      <div class="loading-state" id="loading-state" role="status">
        <span class="loader" aria-hidden="true"></span>
        جارٍ تحميل مكتبة الفيديوهات…
      </div>

      <section class="video-grid" id="video-grid" aria-label="الفيديوهات"></section>

      <section class="empty-state" id="empty-state" hidden>
        <div class="empty-state__icon" aria-hidden="true">⌕</div>
        <h2>لم نعثر على نتائج</h2>
        <p>جرّب كلمات أخرى أو اختر قائمة تشغيل من القائمة الجانبية.</p>
        <button id="empty-reset" type="button">عرض جميع الفيديوهات</button>
      </section>
    </main>

    <aside class="playlist-panel" id="playlist-panel" aria-label="قوائم التشغيل" tabindex="-1">
      <div class="playlist-panel__header">
        <div>
          <p class="eyebrow">تصفّح حسب الموضوع</p>
          <h2>قوائم التشغيل</h2>
        </div>
        <button class="panel-close" id="panel-close" type="button" aria-label="إغلاق قوائم التشغيل">×</button>
      </div>
      <nav id="playlist-list" aria-label="اختيار قائمة تشغيل"></nav>
    </aside>
  </div>

  <button class="drawer-backdrop" id="drawer-backdrop" type="button" aria-label="إغلاق قوائم التشغيل" hidden></button>

  <template id="video-card-template">
    <article class="video-card">
      <div class="video-card__media"></div>
      <div class="video-card__body">
        <h2 class="video-card__title"></h2>
        <div class="video-card__meta">
          <time></time>
          <a class="youtube-link" target="_blank" rel="noopener noreferrer">
            فتح في يوتيوب
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 5h5v5m0-5-8 8M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
          </a>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
